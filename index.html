<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Đăng ký đột xuất</title>

  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <meta name="apple-mobile-web-app-title" content="Đăng ký đột xuất">
  <meta name="application-name" content="Đăng ký đột xuất">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#C62828">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff5f5;
      font-family: Arial, sans-serif;
      color: #5b1111;
      text-align: center;
    }

    .card {
      width: min(90%, 420px);
      padding: 36px 24px;
      background: #ffffff;
      border-radius: 28px;
      box-shadow: 0 14px 45px rgba(128,0,0,.12);
    }

    .icon {
      width: 140px;
      height: 140px;
      border-radius: 30px;
      object-fit: cover;
    }

    h1 {
      margin: 22px 0 8px;
      font-size: 26px;
      color: #C62828;
    }

    p {
      margin: 0 0 28px;
      color: #7a5454;
      line-height: 1.5;
    }

    .button {
      display: block;
      width: 100%;
      padding: 16px;
      background: #C62828;
      color: white;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 14px;
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="icon" src="icon.png" alt="Đăng ký đột xuất">

    <h1>ĐĂNG KÝ ĐỘT XUẤT</h1>

    <p>
      Hệ thống đăng ký đột xuất<br>
      NUS 2026 - 2027
    </p>

    <a class="button" href="https://script.google.com/macros/s/AKfycbzpOs90RGEH_HZWfNnNBtz2ybjnLrcAsZD82lQO06pz_T9vGPXEbZHkhV1ia-3oCCKh/exec">
      MỞ ĐĂNG KÝ ĐỘT XUẤT
    </a>
  </main>
</body>
</html>
